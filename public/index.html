#splash .sp-orb:nth-child(3){width:180px;height:180px;background:radial-gradient(circle,#C8DBF8,#BEB0F4);top:40%;left:55%;animation-delay:2s}
@keyframes sp-float{0%{transform:translate(0,0) scale(1)}100%{transform:translate(20px,-30px) scale(1.15)}}
#splash .sp-content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:0 24px}
#splash .sp-logo{width:120px;height:120px;border-radius:50%;box-shadow:0 12px 40px rgba(135,110,235,.25);border:5px solid rgba(255,255,255,.8);animation:sp-pop .7s cubic-bezier(.34,1.56,.64,1) both;background:#fff}
#splash .sp-title{font:800 2rem/1.15 var(--fh);color:#2E2A54;opacity:0;animation:sp-fadeUp .6s ease .45s forwards}

#splash .sp-dot:nth-child(3){animation-delay:.4s;background:#E0B0E4}
#splash .sp-foot{display:flex;align-items:center;gap:6px;margin-top:32px;opacity:0;animation:sp-fadeUp .5s ease 1.2s forwards}

<script>
(()=>{
const K='cj2:',$=i=>document.getElementById(i);
const g=k=>{try{return localStorage.getItem(K+k)}catch(e){return null}};
const s=(k,v)=>{try{localStorage.setItem(K+k,v);return true}catch(e){return false}};
const LJ=(k,d=[])=>{try{return JSON.parse(g(k))||d}catch(e){return d}};
const LS=(k,v)=>s(k,JSON.stringify(v));const J=k=>D[k]||[];const TH=g('theme')||'light';if(TH!=='auto')document.documentElement.setAttribute('data-theme',TH);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()),today=()=>iso(new Date());
const dt=d=>d.split('-').reverse().join('/'),fm=n=>String(n).replace('.',','),num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)&&n>0?n:null};
const mo=(b,d=today())=>{const x=new Date(b+'T00:00:00'),y=new Date(d+'T00:00:00');let m=(y.getFullYear()-x.getFullYear())*12+y.getMonth()-x.getMonth();if(y.getDate()<x.getDate())m--;return m};
const ageT=m=>m<1?'recém-nascido':m<12?m+(m===1?' mês':' meses'):Math.floor(m/12)+(m<24?' ano':' anos')+(m%12?' e '+m%12+(m%12===1?' mês':' meses'):'');
const FN=['0 a 12 meses','1 a 2 anos','2 a 3 anos','3 a 4 anos'];
const C=[
{f:0,t:'Umbigo do recém-nascido',a:'O coto costuma cair até o fim da 2ª semana de vida.',b:'Ministério da Saúde: depois do banho, seque o local e passe apenas álcool 70%, sem deixar escorrer na pele. Não coloque faixas, moedas ou outras substâncias sobre o coto.',n:'A SBP (2021) orienta só manter limpo e seco, sem antisséptico de rotina. Se a maternidade ou o pediatra disse outra coisa, siga quem examinou seu bebê.',c:'Vermelhidão ao redor, secreção amarelada, pus ou mau cheiro podem ser infecção: leve o bebê imediatamente a um serviço de saúde.',s:'Ministério da Saúde, Caderneta da Criança (6ª ed., 2023); SBP (2021).'},
{f:0,t:'Amamentação: dor e pega',a:'No começo pode haver desconforto, mas dor que continua indica que a pega precisa melhorar. Rachaduras podem ser sinal de pega errada.',b:'Ministério da Saúde: bebê de frente, barriga com barriga, bem apoiado. Só ofereça o peito quando ela abrir bem a boca. Pega boa: queixo encostado na mama, lábios para fora, nariz livre e mais aréola visível em cima. Sem horários fixos. Só leite materno até 6 meses (sem água, chá ou outro leite); depois, com alimentos, até 2 anos ou mais. Evite chupeta, mamadeira e protetor de silicone.',c:'Se as mamas ficarem empedradas e não melhorarem, se piorarem ou surgir outra dificuldade, procure a UBS ou um banco de leite humano. Se não for possível amamentar, o profissional orienta outro leite.',s:'Ministério da Saúde, Caderneta da Criança (2023).'},
{f:0,t:'Assadura',a:'A pele coberta pela fralda fica vermelha e dói.',b:'Ministério da Saúde: troque a fralda sempre que estiver molhada ou suja, limpe de preferência com água e lave as mãos antes e depois. Não use talco.',c:'A vermelhidão pode ser assadura ou alergia: peça orientação ao profissional antes de passar pomadas.',s:'Ministério da Saúde, Caderneta (2023); SBP (2021).'},
{f:0,t:'Sono seguro e choro',a:'Chorar é normal: é a forma de o bebê se comunicar. A maioria se acalma no colo ou no peito. Bebês não ficam viciados em colo.',b:'Ministério da Saúde: deite de barriga para cima, sem travesseiro nem cobertor, com boca e nariz descobertos e roupa adequada à temperatura. Nos primeiros meses, o berço fica ao lado da cama dos pais. Evite deixar o bebê chorando sozinho. SBP: superfície firme, sem objetos soltos e sem dividir a cama. Cólica (SBP): colo, barriga com barriga, banho ou compressa morna, ambiente calmo.',n:'Se você estiver no limite: nunca sacuda o bebê. Coloque-o no berço, afaste-se um pouco e volte a olhá-lo em 5 a 10 minutos.',c:'Choro que preocupa, ou qualquer sinal de perigo (cartão seguinte).',s:'Ministério da Saúde, Caderneta (2023); SBP.'},
{f:0,t:'Sinais de perigo no bebê',la:'Menores de 2 meses',a:'Muito molinho ou caidinho; muito sonolento, difícil de acordar; convulsão ou perda de consciência; cansaço ou respiração rápida; não consegue mamar; temperatura baixa (35,5 °C ou menos) ou febre (37,5 °C ou mais); pus no ouvido; manchas vermelhas ou roxas; urina escura; fezes com sangue. Também: pele amarelada nas primeiras 24 horas, muito forte, espalhada ou por mais de 2 semanas, e fezes muito claras.',lb:'2 meses ou mais',b:'Dificuldade para respirar ou respiração rápida; não consegue mamar ou beber; vomita tudo; muito sonolento; convulsão ou perda de consciência; pele com pouca elasticidade; manchas vermelhas ou roxas.',lc:'O que fazer',c:'Procure um serviço de saúde na hora. Se for difícil chegar, ligue 192 (SAMU), gratuito. A lista não é completa: se algo parecer errado, procure atendimento.',s:'Ministério da Saúde, Caderneta (2023).'},
{f:1,t:'Fala e comunicação (1 a 2 anos)',a:'O que a maioria das crianças faz (SBP/CDC): aos 12 meses, acena tchau, chama mamã ou papá, entende “não”; aos 15, tenta 1 ou 2 palavras e aponta para pedir; aos 18, tenta 3 ou mais palavras e segue instruções sem gesto; aos 2 anos, junta duas palavras (“mais leite”). Cada criança tem seu ritmo.',b:'Ministério da Saúde: converse, cante e leia (pelo menos 10 minutos por dia), nomeie objetos, faça pedidos simples e fale as palavras corretas, sem muitos diminutivos. Telas: a SBP não recomenda para menores de 2 anos.',c:'Se faltar um marco, se a criança perder uma habilidade que tinha ou se você estiver preocupado, converse com o pediatra, sem esperar. Peça para marcar os marcos da Caderneta (págs. 81 a 86). No SUS, o rastreio de autismo (M-CHAT) é feito na UBS entre 16 e 30 meses.',s:'Ministério da Saúde, Caderneta (2023) e linha de cuidado do autismo (2025); SBP/CDC.'},
{f:1,t:'Birra (1 a 2 anos)',a:'Gritar, chorar e se jogar no chão são comportamentos frequentes. É autoafirmação e não quer dizer que a criança seja nervosa: ela ainda não sabe negociar com palavras.',b:'Ministério da Saúde: não reaja à birra falando, gritando ou batendo. Espere com calma e não ceda. Quando ela se acalmar e pedir do jeito certo, atenda se for possível e elogie. Dê limites com clareza e carinho, repetindo quantas vezes precisar. Use o “não” só quando for necessário, com firmeza e sem agressividade. SBP/CDC: poucas palavras, dê nome ao sentimento e ofereça duas opções.',c:'Se as crises não ficam mais curtas e raras com o tempo, ou se você se sente no limite, converse com o pediatra.',s:'Ministério da Saúde, Caderneta (2023); SBP/CDC.'},
{f:1,t:'Sono (1 a 2 anos)',a:'Crianças de 1 a 2 anos precisam de 11 a 14 horas de sono por dia, contando as sonecas (SBP/CDC).',b:'Rotina calma e igual toda noite: pijama, escovar os dentes, 1 ou 2 livros. Sem tela no quarto. O Ministério da Saúde orienta evitar deixar a criança chorando sozinha. As famílias fazem escolhas diferentes (dormir junto ou ensinar a dormir sozinho): escolha o que a sua consegue manter e converse com o pediatra.',c:'Se o sono está muito difícil e afetando a família.',s:'SBP/CDC; Ministério da Saúde, Caderneta (2023).'},
{f:1,t:'Recusa de comida (1 a 2 anos)',a:'A criança nem sempre come igual todo dia, e recusar um alimento é comum.',b:'Ministério da Saúde: ofereça de novo em outras refeições, pois podem ser necessárias 8 a 10 tentativas. Variar o preparo ajuda. Até os 2 anos, sem açúcar e sem ultraprocessados (achocolatado, suco de caixa, bolacha, salgadinho); prefira água. Coma junto com a família, sem TV nem celular, e respeite os sinais de fome e de saciedade. Deixe comer com as mãos e incentive os talheres. Pergunte na UBS sobre o suplemento de ferro (6 a 24 meses).',c:'Se a criança está emagrecendo, aceita pouquíssimos alimentos ou você se preocupa com o crescimento, leve a Caderneta ao pediatra.',s:'Ministério da Saúde, Caderneta (2023) e Guia Alimentar para crianças menores de 2 anos (2019).'},
{f:2,t:'Birra intensa e “não quer ir embora”',a:'Aos 2 e 3 anos a criança quer fazer do jeito dela, e ainda não sabe esperar nem lidar com frustração.',b:'Ministério da Saúde: espere com calma, sem gritar nem bater, e elogie quando ela se acalmar. Evite falas como “Saia daí!”, “Não pode!” e “Fique quieta!”; explique o perigo quando for o caso. É hora de ensinar a esperar a vez e a lidar com pequenas frustrações. No meio da crise, explicar muito costuma não funcionar: ofereça duas opções e proponha o que ela pode fazer.',c:'Se as crises são muito frequentes ou intensas, ou se a criança perdeu habilidades.',s:'Ministério da Saúde, Caderneta (2023); SBP/CDC.'},
{f:2,t:'Desfralde',a:'Perto dos 2 anos, muitas crianças começam a falar ou apontar quando fazem xixi ou cocô.',b:'Ministério da Saúde: incentive em clima de brincadeira, sem pressionar nem repreender. Deixe sem fralda durante o dia, para ela perceber. Quando notar a vontade, leve ao penico sem forçar. Continue estimulando entre 2 e 3 anos: a retirada da fralda depende muito da presença motivadora dos cuidadores. SBP/CDC: a maioria só consegue entre 2 e 3 anos, e pressão pode atrasar.',c:'Se está difícil depois de tentar, converse com o pediatra.',s:'Ministério da Saúde, Caderneta (2023); SBP/CDC.'},
{f:2,t:'Fala, comunicação e como buscar avaliação',a:'SBP/CDC: aos 30 meses, fala cerca de 50 palavras, junta duas palavras com uma de ação e usa “eu” e “você”. Aos 3 anos, conversa com trocas de turno, faz perguntas (quem, o quê, onde, por quê) e os outros a entendem na maior parte do tempo.',b:'Ministério da Saúde, sinais de alerta: não busca interação ou não responde ao olhar, à fala e ao nome; mais interesse em objetos do que em pessoas; isolada, não brinca com outras crianças; dificuldade na fala e em atender comandos; gestos repetitivos; sensibilidade forte a barulhos; muita agressividade. Na maioria das vezes não é nada sério, mas quanto antes for identificado, melhor. Atraso de fala nem sempre é autismo, e só um profissional avalia.',c:'Procure a UBS: a atenção primária faz a avaliação inicial e o rastreio e encaminha. Peça que a queixa fique registrada. Segundo o Ministério da Saúde, os estímulos devem começar logo, sem esperar o diagnóstico. Leve Cartão SUS, documento e a Caderneta.',s:'Ministério da Saúde, Caderneta (2023) e linha de cuidado do autismo (2025); SBP/CDC.'},
{f:2,t:'Creche: adaptação',a:'Cada criança vive a adaptação do seu jeito. Aos 3 anos, a maioria se acalma em até 10 minutos depois de ser deixada (SBP/CDC).',b:'Ministério da Saúde: se puder, fique disponível para acompanhar os primeiros dias de adaptação, que é um direito. Converse com a escola sobre como apoiar a criança nessa passagem. Conheça o cardápio e o projeto pedagógico. Despedida rápida e alegre, sem sumir.',c:'Se a escola relata dificuldades que se repetem em vários lugares, ou se a criança perdeu habilidades.',s:'Ministério da Saúde, Caderneta (2023); SBP/CDC.'},
{f:3,t:'Raiva e bater nos colegas',a:'Aos 3 e 4 anos a criança ainda está aprendendo a usar palavras em vez das mãos.',b:'SBP/CDC: dê nome à emoção (“você está bravo”), ensine a respirar fundo, abraçar um brinquedo ou ir a um lugar calmo. Combine uma regra simples (“toque suave”), mostre o que fazer no lugar de bater e reconheça quando ela cumprir. Ensine “posso ter a minha vez?”. Ministério da Saúde: não grite nem seja agressivo diante da criança, porque ela imita.',c:'Se bater ou machucar é muito frequente, em vários lugares, ou se a criança perdeu habilidades.',s:'SBP/CDC; Ministério da Saúde, Caderneta (2023).'},
{f:3,t:'Limites e regras sem gritar',a:'Amar não é permitir tudo: a criança precisa aprender o que pode, o que não pode e o que é perigoso (Ministério da Saúde).',b:'Ministério da Saúde: ensine os limites com clareza, segurança e carinho, com calma, repetindo quantas vezes for preciso e sem exigir mais do que ela entende. Dê uma ordem de cada vez. SBP/CDC: poucas regras, atenção ao que ela faz de bom e escolhas simples. Aos 4 e 5 anos ela pode “responder de volta” para testar: dê atividades em que ela lidere.',n:'Lei 13.010/2014: toda criança tem direito de ser educada sem castigo físico nem tratamento cruel ou degradante. Telas (SBP): nenhuma até 2 anos e, de 2 a 5 anos, no máximo 1 hora por dia com um adulto.',c:'Se você sente que perdeu o controle ou a situação não melhora.',s:'Ministério da Saúde, Caderneta (2023); SBP/CDC; Lei 13.010/2014.'},
{f:3,t:'Escola e creche (3 a 4 anos)',a:'Aos 3 anos brinca com outras crianças; aos 4, pede para brincar, conforta quem está triste e conta algo do dia (SBP/CDC). A pré-escola é obrigatória a partir dos 4 anos.',b:'Ministério da Saúde: participe das reuniões e converse com os professores. Brincar com outras crianças ajuda. Se a escola reclamar, peça exemplos, veja se acontece também em casa e anote no Caderno. Reclamação da escola não é diagnóstico, mas também não deve ser ignorada (dica do app).',c:'Se o padrão se repete em vários lugares ou a criança perdeu habilidades.',s:'Ministério da Saúde, Caderneta (2023); SBP/CDC.'},
{f:3,t:'Nomear emoções',a:'Aos 3 e 4 anos a criança começa a entender o que sente e o que os outros sentem.',b:'SBP/CDC: fale das emoções dela e dê palavras (triste, bravo, com medo, feliz). Ensine a respirar fundo e a ir a um lugar calmo. Mostre o sentimento dos outros (“ele parece triste”) e converse sobre os personagens dos livros. Ministério da Saúde: ouça com atenção, responda aos “porquês” e não repreenda quando ela contar fantasias.',c:'Se parece triste ou com medo na maior parte dos dias, ou perdeu habilidades.',s:'SBP/CDC; Ministério da Saúde, Caderneta (2023).'}];
const CONS=['Consultas de rotina (Ministério da Saúde): 1ª semana, 1, 2, 4, 6, 9 e 12 meses. Os testes do pezinho, olhinho, orelhinha e coraçãozinho são um direito do bebê.','Consultas de rotina (Ministério da Saúde): 12, 18 e 24 meses. Aos 18 meses e aos 2 anos, pergunte ao pediatra sobre a triagem de desenvolvimento.','Consultas de rotina (Ministério da Saúde): 24 e 36 meses; depois, 1 vez por ano.','Consultas de rotina (Ministério da Saúde): 36 meses; depois, 1 vez por ano. A pré-escola é obrigatória a partir dos 4 anos.'];

return '<details class="cd'+(al?' al':'')+'"><summary>'+x.t+'</summary><div class="bd"><p class="lb">'+(x.la||'O que costuma acontecer')+'</p>'+bl(x.a)+'<p class="lb">'+(x.lb||'O que tentar')+'</p>'+bl(x.b)+(x.n?'<p class="nt">'+x.n+'</p>':'')+'<div class="when"><p class="lb">'+(x.lc||'Quando conversar com o pediatra')+'</p><p>'+x.c+'</p></div><p class="src">Fonte: '+x.s+'</p></div></details>'}
function vs(){return '<section class="card tone"><h2>Você não está sozinho</h2><p>Cansaço, culpa e a sensação de não dar conta são comuns, e acontecem com mães, pais, avós e outros cuidadores. Pedir ajuda faz parte de cuidar bem. O bebê percebe quando quem cuida está tranquilo ou agitado, e por isso quem cuida também precisa de apoio da família e dos amigos (Ministério da Saúde).</p></section><section class="card"><h2>Se o bebê chora e você está no limite</h2><p>Nunca sacuda o bebê. Coloque-o em lugar seguro, afaste-se um pouco e volte a olhá-lo a cada 5 a 10 minutos.</p></section><section class="card"><h2>Tristeza depois do parto</h2><p>O “baby blues” é leve e costuma passar em cerca de 2 semanas. A depressão pós-parto é mais intensa e duradoura: tristeza forte, desespero, perda de interesse, mudanças no sono e no apetite, culpa excessiva, ansiedade. Procure ajuda se durar mais de 2 semanas, piorar ou atrapalhar o cuidado. Tem tratamento.</p></section><section class="card"><h2>Onde buscar ajuda</h2><p><b>UBS:</b> a equipe de saúde da família acompanha o pós-parto e a criança, e encaminha.</p><p><b>CRAS:</b> oferece grupos de convivência e atendimento com assistente social e psicólogo, e orienta sobre Bolsa Família e CadÚnico (Ministério da Saúde).</p><p><b>CVV, 188:</b> apoio emocional gratuito e sigiloso, 24 horas.</p><p><b>192:</b> se você pensa em se machucar ou em machucar a criança, ligue agora para o 188 ou o 192, ou vá ao pronto-socorro.</p></section>'}
